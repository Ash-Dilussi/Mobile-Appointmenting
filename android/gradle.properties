# android/gradle.properties

# ── Gradle daemon & memory ────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# The Pub cache is on C: while this project builds on D:. Kotlin's relocatable
# incremental caches cannot relativize plugin sources across drive roots and
# repeatedly fall back after corrupt/duplicate cache registrations. Release
# builds favor deterministic in-process compilation over that broken cache.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# ── Android build flags ───────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true

# ── Flutter ───────────────────────────────────────────────────────────────────
# Disables R8 full-mode to avoid shrinking issues during development
# Remove for release builds
android.enableR8.fullMode=false
